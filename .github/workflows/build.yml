name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: "build-tools;35.0.0 platforms;android-30"

      # Versões (tags v*) são assinadas com a chave oficial guardada nos segredos do repositório
      - name: Preparar chave de assinatura
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE_BASE64: ${{ secrets.CINELUZ_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Compilar
        env:
          CINELUZ_KEYSTORE: ${{ startsWith(github.ref, 'refs/tags/v') && format('{0}/release.keystore', runner.temp) || '' }}
          CINELUZ_KEYSTORE_PASSWORD: ${{ secrets.CINELUZ_KEYSTORE_PASSWORD }}
          CINELUZ_KEY_ALIAS: ${{ secrets.CINELUZ_KEY_ALIAS }}
          CINELUZ_KEY_PASSWORD: ${{ secrets.CINELUZ_KEY_PASSWORD }}
        run: |
          ./build.sh
          # Nome fixo, para o link ".../releases/latest/download/cineluz-launcher.apk" nunca mudar
          cp build/cineluz-launcher-*.apk build/cineluz-launcher.apk

      - uses: actions/upload-artifact@v4
        with:
          name: cineluz-launcher
          path: build/cineluz-launcher-*.apk

      - name: Publicar versão
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/cineluz-launcher.apk
            build/cineluz-launcher-*.apk
          generate_release_notes: true
